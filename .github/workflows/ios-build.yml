name: Build iOS App

on:
  workflow_dispatch: # اجرای دستی برای جلوگیری از مصرف بی‌رویه دقایق رایگان مک

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Build Web Assets
      run: npm run build

    - name: Create Dummy Out Directory
      run: |
        mkdir -p out
        echo '<!DOCTYPE html><html><head><title>MindNest</title></head><body></body></html>' > out/index.html

    - name: Sync Capacitor iOS
      run: npx cap sync ios

    - name: Install CocoaPods Dependencies
      run: |
        cd ios/App
        pod install

    - name: Build iOS App (Unsigned for Simulator/Testing)
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build