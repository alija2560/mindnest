name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install

    - name: Build Web Assets
      run: npm run build

    - name: Create Dummy Out Directory for Capacitor
      run: |
        mkdir -p out
        echo '<!DOCTYPE html><html><head><title>MindNest</title></head><body></body></html>' > out/index.html

    - name: Force Recreate Capacitor Android Platform
      run: |
        rm -rf android
        npx cap add android

    - name: Copy Icons from public/icons to Android Res
      run: |
        # ساخت پوشه‌های مرجع ایمپکت اندروید و کپی کردن آیکون‌ها
        mkdir -p android/app/src/main/res/mipmap-xxhdpi
        if [ -f "public/icons/icon.png" ]; then
          cp public/icons/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          cp public/icons/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png || true
        fi

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Grant execute permission for gradlew
      run: cd android && chmod +x gradlew

    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk